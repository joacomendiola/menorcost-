server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: rutas del cliente deben resolver a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache basico para assets con hash. Los .mjs del worker de MapLibre se
    # sirven como JavaScript: con application/octet-stream el navegador
    # rechaza el module worker y el mapa cae al estilo de respaldo.
    location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        default_type text/javascript;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
